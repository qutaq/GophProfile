version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  deps:
    desc: Download and tidy Go module dependencies
    cmds:
      - go get github.com/go-chi/chi/v5@latest
      - go get github.com/minio/minio-go/v7@latest
      - go get github.com/rabbitmq/amqp091-go@latest
      - go get github.com/golang-migrate/migrate/v4@latest
      - go get github.com/golang-migrate/migrate/v4/database/postgres@latest
      - go get github.com/golang-migrate/migrate/v4/source/file@latest
      - go mod tidy

  build:
    desc: Build server and worker binaries into bin/
    cmds:
      - go build -o bin/server ./cmd/server
      - go build -o bin/worker ./cmd/worker

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  run-server:
    desc: Run HTTP server
    cmds:
      - go run ./cmd/server

  run-worker:
    desc: Run background worker
    cmds:
      - go run ./cmd/worker

  up:
    desc: Start local infra (Postgres, MinIO, RabbitMQ)
    cmds:
      - docker compose up -d

  down:
    desc: Stop local infra
    cmds:
      - docker compose down

  migrate:
    desc: Apply database migrations
    cmds:
      - go run ./cmd/migrate -direction=up

  migrate:down:
    desc: Roll back the last database migration
    cmds:
      - go run ./cmd/migrate -direction=down

  migrate:version:
    desc: Show current migration version
    cmds:
      - go run ./cmd/migrate -direction=version

  check:
    desc: Check Postgres, MinIO and RabbitMQ connectivity
    cmds:
      - go run ./cmd/check

  infra:
    desc: Start infra, apply migrations and verify connections
    cmds:
      - task: up
      - |
        {{if eq OS "windows"}}powershell -Command "Start-Sleep -Seconds 8"{{else}}sleep 8{{end}}
      - task: migrate
      - task: check

