nameOverride: ""
fullnameOverride: ""

image:
  repository: gophprofile
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

# Non-secret application configuration (ConfigMap).
config:
  APP_ENV: production
  APP_NAME: gophprofile
  HTTP_ADDR: ":8080"
  HTTP_READ_TIMEOUT: 15s
  HTTP_WRITE_TIMEOUT: 15s
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: gophprofile
  DB_NAME: gophprofile
  DB_SSLMODE: disable
  S3_ENDPOINT: minio:9000
  S3_BUCKET: avatars
  S3_USE_SSL: "false"
  S3_REGION: us-east-1
  RABBITMQ_EXCHANGE: avatars.exchange
  UPLOAD_MAX_SIZE_BYTES: "10485760"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  LOG_LEVEL: info
  METRICS_PATH: /metrics
  METRICS_ADDR: ":9091"

# Secret values. Prefer --set / -f secrets.yaml / existingSecret in production.
# Leave empty in git; values-dev.yaml has local compose defaults.
secrets:
  DB_PASSWORD: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  RABBITMQ_URL: ""

# If set, the chart will not create a Secret and will reference this name.
existingSecret: ""

server:
  replicaCount: 2
  otelServiceName: gophprofile-server
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

worker:
  replicaCount: 2
  otelServiceName: gophprofile-worker
  service:
    port: 9091
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  host: gophprofile.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls: []

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

networkPolicy:
  enabled: true
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
  prometheus:
    namespaceLabels:
      kubernetes.io/metadata.name: monitoring
  egress:
    postgres:
      enabled: true
      port: 5432
      podLabels:
        app: postgres
      namespaceLabels: {}
    minio:
      enabled: true
      port: 9000
      podLabels:
        app: minio
      namespaceLabels: {}
    rabbitmq:
      enabled: true
      port: 5672
      podLabels:
        app: rabbitmq
      namespaceLabels: {}
    otlp:
      enabled: true
      port: 4317
      podLabels:
        app: jaeger
      namespaceLabels: {}

migrate:
  enabled: true
  backoffLimit: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
